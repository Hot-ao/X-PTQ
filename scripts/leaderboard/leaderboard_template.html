<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CVPR2027 실험 현황</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#ffffff; --text:#1b2230; --muted:#667085; --line:#e3e6eb; --line2:#eef0f3;
  --accent:#2f6fde; --accent-soft:#e9f0fd; --good:#137a43; --good-soft:#e4f5ec; --bad:#b42318; --bad-soft:#fdecea;
  --warn:#9a5b06; --warn-soft:#fdf3e1; --old:#98a2b3; --ours:#f4f1ff;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1218; --panel:#171b23; --text:#e6e9ef; --muted:#98a2b3; --line:#2a303b; --line2:#202631;
    --accent:#6a9cff; --accent-soft:#1c2a45; --good:#4fc27f; --good-soft:#15301f; --bad:#ff7b6e; --bad-soft:#3a1915;
    --warn:#f2b45a; --warn-soft:#3a2a12; --old:#667085; --ours:#211d33;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1218; --panel:#171b23; --text:#e6e9ef; --muted:#98a2b3; --line:#2a303b; --line2:#202631;
  --accent:#6a9cff; --accent-soft:#1c2a45; --good:#4fc27f; --good-soft:#15301f; --bad:#ff7b6e; --bad-soft:#3a1915;
  --warn:#f2b45a; --warn-soft:#3a2a12; --old:#667085; --ours:#211d33;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Noto Sans KR",sans-serif}
header{max-width:1400px;margin:0 auto;padding:18px 16px 6px;display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
h1{font-size:19px;margin:0}
.sub{color:var(--muted);font-size:12.5px}
nav{max-width:1400px;margin:0 auto;padding:6px 16px;display:flex;gap:6px;flex-wrap:wrap;position:sticky;top:0;background:var(--bg);z-index:5;border-bottom:1px solid var(--line)}
nav button,.subtabs button{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:8px;padding:6px 12px;cursor:pointer;font:inherit}
nav button.on,.subtabs button.on{background:var(--accent);border-color:var(--accent);color:#fff}
main{max-width:1400px;margin:0 auto;padding:10px 16px 40px}
section{display:none} section.on{display:block}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:12px 0}
.panel h2{font-size:15px;margin:0 0 4px}
.panel .desc{color:var(--muted);font-size:12.5px;margin:0 0 10px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line2);text-align:left;vertical-align:top;white-space:nowrap}
th{color:var(--muted);font-weight:600;font-size:12px;background:var(--panel);position:sticky;top:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.ours td{background:var(--ours)}
.grid td{min-width:112px}
.v{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.s{color:var(--muted);font-size:11.5px;font-variant-numeric:tabular-nums}
.old .v{color:var(--old);font-weight:500}
.dpos{color:var(--good)} .dneg{color:var(--bad)}
.badge{display:inline-block;border-radius:6px;padding:0 6px;font-size:11.5px;line-height:18px;border:1px solid transparent}
.b-run{background:var(--accent-soft);color:var(--accent)}
.b-wait{border:1px dashed var(--muted);color:var(--muted)}
.b-done{background:var(--good-soft);color:var(--good)}
.b-fail{background:var(--bad-soft);color:var(--bad)}
.b-stop,.b-hold{background:var(--line2);color:var(--muted)}
.b-old{background:var(--warn-soft);color:var(--warn)}
.b-new{background:var(--accent);color:#fff}
.cards{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;min-width:120px}
.card b{font-size:13px} .card .s{display:block}
.meter{height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:4px}
.meter i{display:block;height:100%;background:var(--accent)}
details>summary{cursor:pointer;list-style:none}
details>summary::-webkit-details-marker{display:none}
.qhead{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.qhead .bar{flex:1;min-width:140px;height:8px;background:var(--line);border-radius:4px;overflow:hidden;display:flex}
.bar .d{background:var(--good)} .bar .r{background:var(--accent)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.tools input,.tools select,td select{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 8px}
.tools button{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:6px;padding:4px 10px;cursor:pointer}
.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.subtabs button .c{opacity:.75;margin-left:4px}
.star{color:var(--warn);letter-spacing:-1px}
.legend{display:flex;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin:4px 0 0}
.mono{font-family:var(--mono);font-size:12px}
.muted{color:var(--muted)}
@media (max-width:640px){ header,nav,main{padding-left:16px;padding-right:16px} th,td{padding:5px 6px} }
</style>
</head>
<body>
<header>
  <h1>CVPR2027 실험 현황</h1>
  <span class="sub" id="gen"></span>
</header>
<nav id="nav">
  <button data-s="queue">실험 대기열</button>
  <button data-s="fixed">주요 표</button>
  <button data-s="tables">결과 분류</button>
</nav>
<main>
  <section id="queue"></section>
  <section id="fixed"></section>
  <section id="tables"></section>
</main>
<script>
const D = /*__DATA__*/null;
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem('lb.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('lb.' + k, JSON.stringify(v)); } catch (e) {} }
};
const pad = n => String(n).padStart(2, '0');
const ts = t => { if (!t) return ''; const d = new Date(t * 1000); return `${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const dur = s => s < 3600 ? `${Math.round(s / 60)}분` : `${(s / 3600).toFixed(1)}시간`;
const f2 = v => v == null ? '–' : v.toFixed(2);
const recent = t => t && D.now - t < 86400;

$('#gen').textContent = `생성 ${D.generated} · 로그 ${D.n_logs}개 · 10분마다 갱신`;

// ---------- 탭 ----------
function show(s) {
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.s === s));
  document.querySelectorAll('main section').forEach(x => x.classList.toggle('on', x.id === s));
  store.set('tab', s);
}
$('#nav').addEventListener('click', e => { if (e.target.dataset.s) show(e.target.dataset.s); });

// ---------- 대기열 ----------
const STATE = {'진행': 'b-run', '대기': 'b-wait', '완료': 'b-done', '실패': 'b-fail', '정지': 'b-stop', '보류': 'b-hold'};
function renderQueue() {
  let h = '';
  if (D.gpus.length) {
    h += '<div class="panel"><h2>GPU</h2><div class="cards">' + D.gpus.map(g => {
      const mem = +g.mem / +g.tot * 100;
      return `<div class="card"><b>GPU ${esc(g.i)}</b><span class="s">${esc(g.name.replace('NVIDIA ', ''))}</span>
        <span class="s">사용률 ${esc(g.util)}% · 메모리 ${(+g.mem / 1024).toFixed(1)}/${(+g.tot / 1024).toFixed(0)} GB</span>
        <div class="meter"><i style="width:${+g.util}%"></i></div></div>`;
    }).join('') + '</div><p class="desc">본인 작업은 GPU 5·6·7. 다른 사용자 프로세스 여부는 작업자가 시작 전에 확인한다.</p></div>';
  }
  for (const q of D.queues) {
    const tot = q.jobs.length, n = q.n;
    const summary = Object.entries(n).filter(([, v]) => v).map(([k, v]) => `<span class="badge ${STATE[k]}">${k} ${v}</span>`).join(' ');
    const rows = q.jobs.map(j => {
      const time = j.done ? `${ts(j.done)} <span class="s">(${dur(j.done - j.start)})</span>`
        : j.start && j.state === '진행' ? `<span class="s">시작 ${ts(j.start)} · ${dur(D.now - j.start)} 경과</span>` : '';
      return `<tr><td><span class="badge ${STATE[j.state]}">${j.state}</span></td><td class="mono">${esc(j.tag)}</td>
        <td>${esc(j.model)}</td><td>${esc(j.setting)}</td><td class="mono">${esc(j.conds)}</td><td>${esc(j.seed)}</td>
        <td>${j.gpu ? 'GPU ' + esc(j.gpu) : ''}</td><td>${time}</td><td class="s">${esc(j.extra)}</td></tr>`;
    }).join('');
    h += `<details class="panel" ${q.active ? 'open' : ''}><summary><div class="qhead"><h2>${esc(q.dir)}</h2>${summary}
      <div class="bar"><span class="d" style="width:${n['완료'] / tot * 100}%"></span><span class="r" style="width:${n['진행'] / tot * 100}%"></span></div>
      <span class="s">마지막 움직임 ${ts(q.last)}</span></div></summary>
      <div class="scroll"><table><thead><tr><th>상태</th><th>태그</th><th>모델</th><th>비트</th><th>조건</th><th>seed</th><th>GPU</th><th>종료 (소요)</th><th>비고</th></tr></thead>
      <tbody>${rows}</tbody></table></div></details>`;
  }
  if (!D.queues.length) h += '<div class="panel">최근 3일 안에 움직인 대기열이 없다.</div>';
  $('#queue').innerHTML = h;
}

// ---------- 주요 표 ----------
function cellHTML(c, opt = {}) {
  if (!c) return '<span class="muted">–</span>';
  if (c.lvis == null && c.pending) return `<span class="badge ${c.pending.startsWith('진행') ? 'b-run' : 'b-wait'}">${esc(c.pending)}</span>`;
  const d = c.d ? `<span class="${c.d[0] >= 0 ? 'dpos' : 'dneg'}">${c.d[0] >= 0 ? '+' : ''}${c.d[0].toFixed(2)}</span>` : '';
  const tip = [`종료 ${ts(c.end)}`, `seed ${c.n}개`, c.src && c.src.join(', '), c.note && `선택: ${c.note}`,
    c.tags && c.tags.length && `기존 규칙: ${c.tags.join(', ')}`].filter(Boolean).join('\n');
  return `<div class="${c.old ? 'old' : ''}" title="${esc(tip)}"><span class="v">${f2(c.lvis)}</span>
    ${recent(c.end) ? '<span class="badge b-new">new</span>' : ''}
    <div class="s">${c.flip != null ? 'flip ' + c.flip.toFixed(1) + '%' : ''}${opt.noN ? '' : ' · n=' + c.n}${d ? ' · Δ ' + d : ''}</div>
    ${c.pending ? `<div><span class="badge ${c.pending.startsWith('진행') ? 'b-run' : 'b-wait'}">${esc(c.pending.split(' · ')[0])}</span></div>` : ''}</div>`;
}
function renderFixed() {
  const F = D.fixed;
  const S1 = F.settings;
  let h = `<div class="legend"><span>값 = LVIS AP (seed 0), 아래 줄 = LVIS flip · BRECQ 대비 Δ (seed 0)</span>
    <span><b style="color:var(--old)">회색</b> = 기존 P·M 규칙 결과 (새 규칙 재실험 전)</span>
    <span><span class="badge b-wait">대기</span> <span class="badge b-run">진행</span> = 대기열에 같은 실험이 있음</span>
    <span>칸에 마우스를 올리면 종료 시각·출처</span></div>`;
  h += `<div class="panel"><h2>표 A · YOLO-World-S 주 결과</h2>
    <p class="desc">Ours(ρ=1.0 선택) = calibration 밖 train flip이 GPM ≤ GP이면 GPM, 아니면 GP (seed 0, 새 규칙).</p>
    <div class="scroll"><table class="grid"><thead><tr><th>방법</th>${S1.map(s => `<th>${s}</th>`).join('')}</tr></thead><tbody>` +
    F.t1.map(r => `<tr class="${r.cond === 'ours' || r.cond === 'qdrop+GPM' ? 'ours' : ''}"><td>${esc(r.label)}</td>${S1.map(s => `<td>${cellHTML(r.cells[s])}</td>`).join('')}</tr>`).join('') +
    '</tbody></table></div></div>';
  const S2 = ['W8A8', 'W4A8', 'W4A5', 'W4A4'];
  h += `<div class="panel"><h2>표 B · 모델별 (BRECQ → Ours)</h2>
    <p class="desc">YOLO 계열 Ours는 표 A와 같은 선택 규칙, OWLv2는 W8A8 M / 그 외 PM, Grounding DINO는 PM. Grounding DINO는 LVIS 일부 이미지로만 평가.</p>
    <div class="scroll"><table class="grid"><thead><tr><th>모델</th>${S2.map(s => `<th>${s}</th>`).join('')}</tr></thead><tbody>` +
    F.t2.map(r => `<tr><td>${esc(r.label)}</td>${S2.map(s => {
      const c = r.cells[s];
      if (!c) return '<td><span class="muted">–</span></td>';
      return `<td><div class="s">FP ${f2(c.fp && c.fp.lvis)} · BRECQ ${f2(c.brecq && c.brecq.lvis)}${c.qdrop ? ' · QDrop ' + f2(c.qdrop.lvis) : ''}${c.proto ? ' · ' + esc(c.proto) : ''}</div>${cellHTML(c.ours)}</td>`;
    }).join('')}</tr>`).join('') + '</tbody></table></div></div>';
  const S3 = ['W4A8', 'W4A5', 'W4A4'];
  h += `<div class="panel"><h2>표 C · YOLO-World-S ablation</h2>
    <p class="desc">G 게이트 교환, P 보호(1.5%), M 이전, R 무작위 보호, H HAWQ식 보호, S SmoothQuant, W AWQ.</p>
    <div class="scroll"><table class="grid"><thead><tr><th>조건</th>${S3.map(s => `<th>${s}</th>`).join('')}</tr></thead><tbody>` +
    F.t3.map(r => `<tr class="${r.cond === 'brecq+GPM' ? 'ours' : ''}"><td class="mono">${esc(r.label)}</td>${S3.map(s => `<td>${cellHTML(r.cells[s])}</td>`).join('')}</tr>`).join('') +
    '</tbody></table></div></div>';
  $('#fixed').innerHTML = h;
}

// ---------- 결과 분류 ----------
let assign = store.get('assign', {});
let cur = store.get('tbl', '주요지표');
const tblOf = g => assign[g.key] || g.tbl;
function renderTables() {
  const counts = {};
  D.results.forEach(g => { const t = tblOf(g); counts[t] = (counts[t] || 0) + 1; });
  const tabs = [...D.tables, '전체'];
  const flt = store.get('flt', {q: '', m: '', recent: false, sort: 'end'});
  let h = `<div class="panel"><h2>결과 분류</h2>
    <p class="desc">결과 하나 = 모델 × 프로토콜 × 비트 × 조건 × 규칙 (seed 평균). 중요도와 기본 표는 자동 판단이고, 오른쪽 선택 상자로 표를 바꿀 수 있다.
    바꾼 배정은 이 브라우저에 저장된다. 모두에게 기본값으로 쓰려면 "배정 복사"로 JSON을 복사해 <span class="mono">scripts/leaderboard/table_assign.json</span>에 넣는다.</p>
    <div class="subtabs" id="subtabs">${tabs.map(t => `<button data-t="${esc(t)}" class="${t === cur ? 'on' : ''}" title="${esc(D.table_desc[t] || '모든 결과')}">${esc(t)}<span class="c">${t === '전체' ? D.results.length : (counts[t] || 0)}</span></button>`).join('')}</div>
    <p class="desc" style="margin:2px 0 0">${esc(D.table_desc[cur] || '모든 결과')}</p>
    <div class="tools">
      <input id="q" placeholder="검색 (조건, 비트, 출처…)" value="${esc(flt.q)}">
      <select id="fm"><option value="">모든 모델</option>${D.models.map(m => `<option ${flt.m === m ? 'selected' : ''} value="${m}">${m}</option>`).join('')}</select>
      <select id="fs"><option value="end" ${flt.sort === 'end' ? 'selected' : ''}>종료 최신순</option><option value="imp" ${flt.sort === 'imp' ? 'selected' : ''}>중요도순</option><option value="model" ${flt.sort === 'model' ? 'selected' : ''}>모델·비트순</option></select>
      <label><input type="checkbox" id="fr" ${flt.recent ? 'checked' : ''}> 최근 24시간</label>
      <button id="exp">배정 복사 (JSON)</button><button id="rst">배정 초기화</button><span class="s" id="msg"></span>
    </div><div class="scroll"><table><thead><tr><th>종료</th><th>중요도</th><th>모델</th><th>비트</th><th>조건</th><th>규칙·프로토콜</th><th class="num">seed</th>
    <th class="num">COCO AP</th><th class="num">LVIS AP</th><th class="num">Δ vs BRECQ</th><th class="num">LVIS flip</th><th class="num">train flip</th><th>판단 근거</th><th>출처</th><th>표</th></tr></thead><tbody id="rows"></tbody></table></div></div>`;
  $('#tables').innerHTML = h;
  const order = Object.fromEntries(D.models.map((m, i) => [m, i]));
  const sorder = Object.fromEntries(D.settings.map((s, i) => [s, i]));
  function rows() {
    const q = $('#q').value.trim().toLowerCase(), fm = $('#fm').value, fr = $('#fr').checked, fs = $('#fs').value;
    store.set('flt', {q, m: fm, recent: fr, sort: fs});
    let L = D.results.filter(g => (cur === '전체' || tblOf(g) === cur) && (!fm || g.m === fm) && (!fr || recent(g.end))
      && (!q || [g.name, g.s, g.c, g.p, g.src.join(' '), g.tags.join(' '), g.why].join(' ').toLowerCase().includes(q)));
    if (fs === 'imp') L.sort((a, b) => b.imp - a.imp || b.end - a.end);
    else if (fs === 'model') L.sort((a, b) => (order[a.m] ?? 99) - (order[b.m] ?? 99) || (sorder[a.s] ?? 9) - (sorder[b.s] ?? 9) || a.c.localeCompare(b.c));
    else L.sort((a, b) => b.end - a.end);
    const st = g => g.stats || {};
    $('#rows').innerHTML = L.slice(0, 600).map(g => {
      const s = st(g), d = g.d && g.d.lvis;
      const proto = (g.p.startsWith('확정') ? '' : g.p) + (g.tags.length ? (g.p.startsWith('확정') ? '' : ' · ') : '');
      return `<tr><td>${ts(g.end)} ${recent(g.end) ? '<span class="badge b-new">new</span>' : ''}</td>
        <td class="star" title="${g.imp === 3 ? '높음' : g.imp === 2 ? '중간' : '낮음'}">${'★'.repeat(g.imp)}<span class="muted">${'☆'.repeat(3 - g.imp)}</span></td>
        <td>${esc(g.name)}</td><td>${esc(g.s)}</td><td class="mono">${esc(g.c)}</td>
        <td>${esc(proto)}${g.tags.map(t => `<span class="badge b-old">${esc(t)}</span> `).join('')}</td>
        <td class="num">${g.seeds.length}</td>
        <td class="num">${f2(s.coco && s.coco[0])}</td>
        <td class="num"><b>${f2(s.lvis && s.lvis[0])}</b>${s.lvis && s.lvis[1] != null ? `<span class="s"> ±${s.lvis[1].toFixed(2)}</span>` : ''}</td>
        <td class="num ${d ? (d.m >= 0 ? 'dpos' : 'dneg') : ''}">${d ? (d.m >= 0 ? '+' : '') + d.m.toFixed(2) + (d.ci != null ? `<span class="s"> ±${d.ci.toFixed(2)}</span>` : '') : ''}</td>
        <td class="num">${s.lvis_flip ? s.lvis_flip[0].toFixed(2) : ''}</td>
        <td class="num">${s.tf ? s.tf[0].toFixed(2) : ''}</td>
        <td class="s">${esc(g.why)}</td><td class="s mono">${esc(g.src.map(x => x.replace(/^runs\//, '')).join(' '))}</td>
        <td><select data-k="${esc(g.key)}">${D.tables.map(t => `<option ${tblOf(g) === t ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select></td></tr>`;
    }).join('') || '<tr><td colspan="15" class="muted">해당 결과 없음</td></tr>';
  }
  rows();
  ['q', 'fm', 'fs', 'fr'].forEach(id => $('#' + id).addEventListener(id === 'q' ? 'input' : 'change', rows));
  $('#subtabs').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { cur = b.dataset.t; store.set('tbl', cur); renderTables(); } });
  $('#rows').addEventListener('change', e => {
    const k = e.target.dataset.k; if (!k) return;
    const g = D.results.find(x => x.key === k);
    if (e.target.value === g.tbl) delete assign[k]; else assign[k] = e.target.value;
    store.set('assign', assign); renderTables();
  });
  $('#exp').onclick = () => {
    const all = {}; D.results.forEach(g => { if (assign[g.key]) all[g.key] = assign[g.key]; });
    const txt = JSON.stringify(all, null, 1);
    (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(
      () => $('#msg').textContent = `${Object.keys(all).length}개 배정을 복사했다`,
      () => { prompt('복사해서 table_assign.json에 붙여 넣기', txt); });
  };
  $('#rst').onclick = () => { if (confirm('이 브라우저에 저장한 표 배정을 모두 지울까?')) { assign = {}; store.set('assign', assign); renderTables(); } };
}

renderQueue(); renderFixed(); renderTables();
show(store.get('tab', 'queue'));
// 10분마다 다시 읽는다(선택한 탭·필터·배정은 브라우저에 남는다)
setTimeout(() => location.reload(), 600000);
</script>
</body>
</html>
